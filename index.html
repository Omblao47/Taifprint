<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAIF PRINT ERP</title>
<meta name="theme-color" content="#12305F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--navy:#12305F;--bg:#F4F6FA;--card:#fff;--line:#E3E8F0;--ink:#1B2433;--mute:#5B6678;--blue:#1D4ED8;--green:#0F766E;--red:#B42318;--amber:#B54708}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input{font-family:inherit;font-size:16px}
#app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
.top .t{flex:1}.top small{display:block;color:#C9D6EE;font-size:12px}.top b{font-size:19px}
.ghost{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #5B7BB5;background:transparent;color:#fff;font-weight:600;cursor:pointer}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card small{color:var(--mute);font-size:13px}.num{font-size:28px;font-weight:700;line-height:1.2}
h2{font-size:15px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.badge{font-size:12px;border-radius:8px;padding:2px 10px;background:#EEF2F8;color:var(--mute)}
.badge.late{background:#FDECEA;color:#8F1D14}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));position:sticky;bottom:0}
.nav button{min-height:56px;border:0;background:transparent;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.on{color:var(--navy);font-weight:700}
.login{margin:auto;width:100%;max-width:380px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px;color:var(--navy)}
.login input{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.btn{min-height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.err{color:var(--red);font-size:14px;min-height:20px}
.muted{color:var(--mute);font-size:14px;text-align:center;padding:12px}
:focus-visible{outline:3px solid #7AA2F7;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const SUPABASE_URL = 'https://rierymzwgjdxccgfxitl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fvG1ZCdZ-nR210L5Hzr38A_x7DY7Ap8';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const T = {
ar:{email:'البريد الإلكتروني',password:'كلمة المرور',login:'دخول',logout:'خروج',loginErr:'البريد أو كلمة المرور غير صحيحة',noProfile:'حسابك غير مفعّل بعد. تواصل مع المدير.',hello:'مرحباً',home:'الرئيسية',production:'الإنتاج',orders:'الطلبات',stock:'المخزون',tasks:'مهامي',newOrders:'طلبات جديدة',inProd:'قيد الإنتاج',late:'متأخرة',lowStock:'مواد منخفضة',latest:'أحدث الطلبات',none:'لا توجد طلبات بعد',soon:'يُبنى هذا القسم في الخطوة التالية',loading:'جارٍ التحميل…',err:'تعذّر تحميل البيانات',
role:{manager:'المدير',production_manager:'مسؤول الإنتاج',sales:'الاستقبال والمبيعات',operator:'عامل إنتاج',storekeeper:'مسؤول المخزون'},
st:{received:'جديدة',quoted:'عرض سعر',design:'تصميم',awaiting_approval:'بانتظار الموافقة',approved:'معتمدة',production:'قيد الإنتاج',quality_check:'مراقبة الجودة',ready:'جاهزة للتسليم',delivered:'مُسلَّمة',cancelled:'ملغاة'}},
fr:{email:'E-mail',password:'Mot de passe',login:'Connexion',logout:'Déconnexion',loginErr:'E-mail ou mot de passe incorrect',noProfile:"Votre compte n'est pas encore activé. Contactez l'administrateur.",hello:'Bonjour',home:'Accueil',production:'Production',orders:'Commandes',stock:'Stock',tasks:'Mes tâches',newOrders:'Nouvelles commandes',inProd:'En production',late:'En retard',lowStock:'Stock bas',latest:'Dernières commandes',none:'Aucune commande',soon:'Cette section arrive à la prochaine étape',loading:'Chargement…',err:'Chargement impossible',
role:{manager:'Administrateur',production_manager:'Chef de production',sales:'Commercial / Réception',operator:'Opérateur',storekeeper:'Magasinier'},
st:{received:'Nouvelle',quoted:'Devis',design:'Design',awaiting_approval:'Attente validation',approved:'Validée',production:'En production',quality_check:'Contrôle qualité',ready:'Prête',delivered:'Livrée',cancelled:'Annulée'}}};
let lang = localStorage.getItem('lang') || 'ar';
const t = k => T[lang][k] ?? k;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV = {manager:['home','production','orders','stock'],production_manager:['production','orders','stock'],sales:['orders'],operator:['tasks'],storekeeper:['stock']};
const ICON = {home:'M3 11l9-8 9 8v9H3z',production:'M3 8h18v10H3zM7 8V4h10v4',orders:'M5 3h14v18H5zM9 8h6M9 12h6',stock:'M3 7l9-4 9 4v10l-9 4-9-4z',tasks:'M5 3h14v18H5zM9 12l2 2 4-4'};
const ic = k => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
const S = {profile:null, tab:null, branch:''};

function applyLang(){ document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }

function login(msg = '') {
  applyLang();
  $('#app').innerHTML = `<form class="login" id="lf"><h1>TAIF PRINT ERP</h1>
  <input id="em" type="email" autocomplete="username" placeholder="${t('email')}" required>
  <input id="pw" type="password" autocomplete="current-password" placeholder="${t('password')}" required>
  <div class="err" id="er" role="alert">${esc(msg)}</div>
  <button class="btn" type="submit">${t('login')}</button>
  <button class="ghost" type="button" id="lg" style="color:#12305F;border-color:#C9D6EE">${lang === 'ar' ? 'Français' : 'العربية'}</button></form>`;
  $('#lg').onclick = () => { lang = lang === 'ar' ? 'fr' : 'ar'; localStorage.setItem('lang', lang); login(); };
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) return ($('#er').textContent = t('loginErr'));
    boot();
  };
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  const { data: p } = await sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!p || !p.active || !NAV[p.role]) { await sb.auth.signOut(); return login(t('noProfile')); }
  S.profile = p;
  if (!localStorage.getItem('lang')) lang = p.language || 'ar';
  const { data: b } = await sb.from('branches').select('name').eq('id', p.branch_id).maybeSingle();
  S.branch = b?.name || '';
  S.tab = NAV[p.role][0];
  shell();
}

function shell() {
  applyLang();
  const p = S.profile;
  $('#app').innerHTML = `<header class="top"><div class="t"><small>${t('hello')}، ${esc(p.full_name)} · ${esc(t('role')[p.role])}</small><b>TAIF PRINT</b>${S.branch ? `<small>${esc(S.branch)}</small>` : ''}</div>
  <button class="ghost" id="lg" aria-label="language">${lang === 'ar' ? 'FR' : 'AR'}</button>
  <button class="ghost" id="lo" aria-label="${t('logout')}">${t('logout')}</button></header>
  <main id="main"></main>
  <nav class="nav">${NAV[p.role].map(k => `<button data-tab="${k}" class="${k === S.tab ? 'on' : ''}">${ic(k)}${t(k)}</button>`).join('')}</nav>`;
  $('#lg').onclick = () => { lang = lang === 'ar' ? 'fr' : 'ar'; localStorage.setItem('lang', lang); shell(); };
  $('#lo').onclick = async () => { await sb.auth.signOut(); login(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; shell(); });
  tab();
}

async function tab() {
  const m = $('#main');
  if (S.tab !== 'home') return (m.innerHTML = `<div class="muted">${t('soon')}</div>`);
  m.innerHTML = `<div class="muted">${t('loading')}</div>`;
  const today = new Date().toISOString().slice(0, 10);
  const cnt = q => q.then(r => r.count ?? 0);
  const head = { count: 'exact', head: true };
  try {
    const [nw, pr, lt, lo, last] = await Promise.all([
      cnt(sb.from('orders').select('id', head).eq('status', 'received')),
      cnt(sb.from('orders').select('id', head).in('status', ['design', 'awaiting_approval', 'approved', 'production', 'quality_check'])),
      cnt(sb.from('orders').select('id', head).lt('due_date', today).not('status', 'in', '(delivered,cancelled)')),
      cnt(sb.from('low_stock_materials').select('id', head)),
      sb.from('orders').select('order_number,status,due_date').order('created_at', { ascending: false }).limit(5)
    ]);
    const card = (l, n, c) => `<div class="card"><small>${l}</small><div class="num" style="color:${c}">${n}</div></div>`;
    const rows = (last.data || []).map(o => `<div class="row"><span><b>${esc(o.order_number)}</b><br><small style="color:var(--mute)">${esc(o.due_date || '')}</small></span>
      <span class="badge ${o.due_date && o.due_date < today && !['delivered', 'cancelled'].includes(o.status) ? 'late' : ''}">${esc(t('st')[o.status] || o.status)}</span></div>`).join('');
    m.innerHTML = `<div class="grid">${card(t('newOrders'), nw, 'var(--blue)')}${card(t('inProd'), pr, 'var(--green)')}${card(t('late'), lt, 'var(--red)')}${card(t('lowStock'), lo, 'var(--amber)')}</div>
    <h2>${t('latest')}</h2><div class="card">${rows || `<div class="muted">${t('none')}</div>`}</div>`;
  } catch (e) { m.innerHTML = `<div class="muted">${t('err')}</div>`; }
}

boot();
</script>
</body>
</html>
