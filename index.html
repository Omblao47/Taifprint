<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAIF PRINT ERP</title>
<meta name="theme-color" content="#12305F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--navy:#12305F;--bg:#F4F6FA;--card:#fff;--line:#E3E8F0;--ink:#1B2433;--mute:#5B6678;--blue:#1D4ED8;--green:#0F766E;--red:#B42318;--amber:#B54708}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font-family:inherit;font-size:16px}
#app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
.top .t{flex:1}.top small{display:block;color:#C9D6EE;font-size:12px}.top b{font-size:19px}
.ghost{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #5B7BB5;background:transparent;color:#fff;font-weight:600;cursor:pointer}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card small{color:var(--mute);font-size:13px}.num{font-size:28px;font-weight:700;line-height:1.2}
h2{font-size:15px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.badge{font-size:12px;border-radius:8px;padding:2px 10px;background:#EEF2F8;color:var(--mute)}
.badge.late{background:#FDECEA;color:#8F1D14}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));position:sticky;bottom:0}
.nav button{min-height:56px;border:0;background:transparent;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.on{color:var(--navy);font-weight:700}
.login{margin:auto;width:100%;max-width:380px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px;color:var(--navy)}
.login input,.f input,.f select,.f textarea{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;width:100%}
.btn{min-height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;padding:0 16px}
.btn.out{background:#fff;color:var(--navy);border:1px solid var(--line)}
.err{color:var(--red);font-size:14px;min-height:20px}
.muted{color:var(--mute);font-size:14px;text-align:center;padding:12px}
.f{display:flex;flex-direction:column;gap:8px}
:focus-visible{outline:3px solid #7AA2F7;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
